e integração: publicar e deixar cada sistema reagir</text><text x="30" y="62" font-size="13" fill="#475569">Hoje a loja publica order.created e order.paid. Os consumidores abaixo são exemplos (ideias).</text><rect x="30" y="170" width="150" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="105.0" y="206.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Loja (Laravel)</text><text x="105.0" y="224.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >pedido pago e</text><text x="105.0" y="238.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >COMMIT confirmado</text><rect x="260" y="170" width="140" height="90" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="330.0" y="206.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Exchange orders</text><text x="330.0" y="224.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >tipo topic</text><text x="330.0" y="238.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >order.*</text><rect x="560" y="80" width="190" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="655.0" y="110.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Faturamento / ERP</text><text x="655.0" y="128.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >fila invoicing.orders</text><rect x="560" y="188" width="190" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="655.0" y="218.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Depósito (WMS)</text><text x="655.0" y="236.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >fila warehouse.orders</text><rect x="560" y="296" width="190" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="655.0" y="326.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Mais vendidos</text><text x="655.0" y="344.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >fila analytics.orders</text><rect x="790" y="188" width="140" height="64" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/><text x="860.0" y="218.0" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle" >DLQ</text><text x="860.0" y="236.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >para análise</text><polyline points="180,215 260,215" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="400,215 480,215 480,112 560,112" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="400,215 480,215 480,220 560,220" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="400,215 480,215 480,328 560,328" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="750,220 790,220" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ah)"/><text x="30" y="295" font-size="12" font-weight="700" fill="#15803d" text-anchor="start" >A loja não sabe quem escuta</text><text x="30" y="312" font-size="12" font-weight="400" fill="#15803d" text-anchor="start" >e segue sem esperar ninguém.</text><g id="pk1" class="anim"><rect x="-43.0" y="-11" width="86.0" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">order.paid</text></g><g id="pk2" class="anim"><rect x="-43.0" y="-11" width="86.0" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">order.paid</text></g><g id="pk3" class="anim"><rect x="-43.0" y="-11" width="86.0" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">order.paid</text></g><g id="pk4" class="anim"><rect x="-43.0" y="-11" width="86.0" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">order.paid</text></g><g id="pk5" class="anim"><rect x="-36.2" y="-11" width="72.4" height="22" rx="11" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">5ª falha</text></g><rect id="gl6" class="anim" x="28" y="168" width="154" height="94" rx="14" fill="none" stroke="#15803d" stroke-width="3"/><rect id="gl7" class="anim" x="258" y="168" width="144" height="94" rx="14" fill="none" stroke="#b45309" stroke-width="3"/><rect id="gl8" class="anim" x="558" y="78" width="194" height="68" rx="14" fill="none" stroke="#15803d" stroke-width="3"/><rect id="gl9" class="anim" x="558" y="294" width="194" height="68" rx="14" fill="none" stroke="#15803d" stroke-width="3"/><rect id="gl10" class="anim" x="558" y="186" width="194" height="68" rx="14" fill="none" stroke="#b91c1c" stroke-width="3"/><rect id="gl11" class="anim" x="788" y="186" width="144" height="68" rx="14" fill="none" stroke="#b91c1c" stroke-width="3"/><g id="pp12" class="anim"><rect x="598.4" y="157" width="113.2" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="655.0" y="171" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">✓ NF-e emitida</text></g><g id="pp13" class="anim"><rect x="544.0" y="265" width="222.0" height="20" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/><text x="655.0" y="279" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">✗ falha: reentrega 1, 2, 3, 4…</text></g><g id="pp14" class="anim"><rect x="578.0" y="373" width="154.0" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="655.0" y="387" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">✓ vendas atualizadas</text></g><g id="pp15" class="anim"><rect x="796.6" y="265" width="126.8" height="20" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/><text x="860.0" y="279" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">mensagem isolada</text></g><text x="30" y="416" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">PASSO A PASSO</text><rect id="hl16" class="anim" x="24" y="424" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="41" cy="440" r="11" fill="#1d4ed8"/><text x="41" y="444" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="60" y="444" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >O pedido é pago e a transação confirma (COMMIT).</text><rect id="hl17" class="anim" x="24" y="460" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="41" cy="476" r="11" fill="#1d4ed8"/><text x="41" y="480" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="60" y="480" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Só então a loja publica order.paid no exchange.</text><rect id="hl18" class="anim" x="24" y="496" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="41" cy="512" r="11" fill="#1d4ed8"/><text x="41" y="516" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="60" y="516" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >O exchange copia a mensagem a cada fila interessada.</text><rect id="hl19" class="anim" x="24" y="532" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="41" cy="548" r="11" fill="#1d4ed8"/><text x="41" y="552" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="60" y="552" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Cada sistema consome no seu ritmo, sem a loja saber.</text><rect id="hl20" class="anim" x="484" y="424" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="440" r="11" fill="#1d4ed8"/><text x="501" y="444" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="520" y="444" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Faturamento emite a NF-e; mais vendidos atualiza.</text><rect id="hl21" class="anim" x="484" y="460" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="476" r="11" fill="#1d4ed8"/><text x="501" y="480" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text><text x="520" y="480" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Um consumidor falha: a mensagem é reentregue (idempotente).</text><rect id="hl22" class="anim" x="484" y="496" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="512" r="11" fill="#1d4ed8"/><text x="501" y="516" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >7</text><text x="520" y="516" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Falhou demais: vai à DLQ e não trava as outras.</text><rect id="hl23" class="anim" x="484" y="532" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="548" r="11" fill="#1d4ed8"/><text x="501" y="552" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >8</text><text x="520" y="552" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Novo sistema? Crie outra fila no exchange; a loja não muda.</text><text x="30" y="602" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">VANTAGENS</text><rect x="30.0" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="44.0" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Baixo acoplamento</text><text x="44.0" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >A loja publica um fato (pedido pago);</text><text x="44.0" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >quem reage é problema de cada sistema.</text><rect x="334.7" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="348.6666666666667" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Cada um no seu ritmo</text><text x="348.6666666666667" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >ERP lento não atrasa o depósito</text><text x="348.6666666666667" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >nem o checkout do próximo cliente.</text><rect x="639.3" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="653.3333333333334" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Falha isolada</text><text x="653.3333333333334" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Mensagem problemática vai à DLQ</text><text x="653.3333333333334" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >e as demais seguem normalmente.</text></svg>
