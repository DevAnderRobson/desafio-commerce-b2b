city:0}100%{opacity:0}}#hl12{animation:hl12 26s linear infinite;opacity:0}@keyframes hl13{0%{opacity:0}5.90%{opacity:0}7.00%{opacity:1}14.00%{opacity:1}15.00%{opacity:0}100%{opacity:0}}#hl13{animation:hl13 26s linear infinite;opacity:0}@keyframes hl14{0%{opacity:0}7.90%{opacity:0}9.00%{opacity:1}16.00%{opacity:1}17.00%{opacity:0}100%{opacity:0}}#hl14{animation:hl14 26s linear infinite;opacity:0}@keyframes hl15{0%{opacity:0}11.90%{opacity:0}13.00%{opacity:1}18.00%{opacity:1}19.00%{opacity:0}100%{opacity:0}}#hl15{animation:hl15 26s linear infinite;opacity:0}@keyframes hl16{0%{opacity:0}21.90%{opacity:0}23.00%{opacity:1}60.00%{opacity:1}61.00%{opacity:0}100%{opacity:0}}#hl16{animation:hl16 26s linear infinite;opacity:0}@keyframes hl17{0%{opacity:0}63.90%{opacity:0}65.00%{opacity:1}92.00%{opacity:1}93.00%{opacity:0}100%{opacity:0}}#hl17{animation:hl17 26s linear infinite;opacity:0}@media (prefers-reduced-motion:reduce){.anim{animation:none!important;opacity:0!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="960" height="720" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="30" y="40" font-size="21" font-weight="700" fill="#0f172a">Rastreamento: da transportadora até a tela do cliente</text><text x="30" y="62" font-size="13" fill="#475569">Fluxo alvo. Hoje a loja SIMULA esses eventos com um agendador (orders:track).</text><rect x="20" y="92" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="85.0" y="132.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Transportadora</text><text x="85.0" y="150.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >serviço de rastreio</text><rect x="175" y="92" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="240.0" y="125.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Exchange</text><text x="240.0" y="143.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >deliveries</text><text x="240.0" y="157.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >delivery.*</text><rect x="330" y="92" width="130" height="84" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="395.0" y="125.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Fila da loja</text><text x="395.0" y="143.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >ecommerce.</text><text x="395.0" y="157.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >deliveries + DLQ</text><rect x="485" y="92" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="550.0" y="132.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Consumidor</text><text x="550.0" y="150.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >ignora duplicatas</text><rect x="640" y="92" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="705.0" y="132.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >PostgreSQL</text><text x="705.0" y="150.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >shipment_events</text><rect x="795" y="92" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="860.0" y="139.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Tela do cliente</text><polyline points="150,134 175,134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="305,134 330,134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="460,134 485,134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="615,134 640,134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="770,134 795,134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text id="sw1" class="anim" x="860.0" y="154" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Enviado (em transporte)</text><text id="sw2" class="anim" x="860.0" y="154" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Entregue ✓</text><line x1="100" y1="312" x2="820" y2="312" stroke="#94a3b8" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="100" cy="312" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/><circle id="pin0" class="anim" cx="100" cy="312" r="9" fill="#15803d"/><text x="100" y="344" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" >Curitiba/PR</text><circle cx="340" cy="312" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/><circle id="pin1" class="anim" cx="340" cy="312" r="9" fill="#15803d"/><text x="340" y="344" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" >São Paulo/SP</text><circle cx="580" cy="312" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/><circle id="pin2" class="anim" cx="580" cy="312" r="9" fill="#15803d"/><text x="580" y="344" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" >Rio de Janeiro/RJ</text><circle cx="820" cy="312" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/><circle id="pin3" class="anim" cx="820" cy="312" r="9" fill="#15803d"/><text x="820" y="344" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" >Niterói/RJ (cliente)</text><g id="truck" class="anim-keep"><rect x="-20" y="-14" width="26" height="18" rx="3" fill="#1d4ed8"/><rect x="8" y="-8" width="14" height="12" rx="2" fill="#2563eb"/><circle cx="-10" cy="7" r="4" fill="#0f172a"/><circle cx="14" cy="7" r="4" fill="#0f172a"/></g><style>@media (prefers-reduced-motion:reduce){#truck{animation:none;transform:translate(100px,278px)}}</style><g id="pk3" class="anim"><rect x="-32.8" y="-11" width="65.6" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">postado</text></g><g id="pk4" class="anim"><rect x="-26.0" y="-11" width="52.0" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">em SP</text></g><g id="pk5" class="anim"><rect x="-53.2" y="-11" width="106.4" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">chegou ao Rio</text></g><g id="pk6" class="anim"><rect x="-36.2" y="-11" width="72.4" height="22" rx="11" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">entregue</text></g><rect id="gl7" class="anim" x="328" y="90" width="134" height="88" rx="14" fill="none" stroke="#b45309" stroke-width="3"/><rect id="gl8" class="anim" x="483" y="90" width="134" height="88" rx="14" fill="none" stroke="#1d4ed8" stroke-width="3"/><rect id="gl9" class="anim" x="793" y="90" width="134" height="88" rx="14" fill="none" stroke="#15803d" stroke-width="3"/><g id="pp10" class="anim"><rect x="314.6" y="249" width="330.8" height="20" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/><text x="480.0" y="263" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">cada evento = uma nova linha na linha do tempo</text></g><g id="pp11" class="anim"><rect x="345.2" y="249" width="269.6" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="480.0" y="263" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">só o evento 'entregue' fecha o pedido</text></g><text x="30" y="416" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">PASSO A PASSO</text><rect id="hl12" class="anim" x="24" y="424" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="41" cy="440" r="11" fill="#1d4ed8"/><text x="41" y="444" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="60" y="444" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >O serviço de rastreio publica delivery.status_updated.</text><rect id="hl13" class="anim" x="24" y="460" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="41" cy="476" r="11" fill="#1d4ed8"/><text x="41" y="480" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="60" y="480" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >A mensagem cai na fila ecommerce.deliveries (com DLQ).</text><rect id="hl14" class="anim" x="24" y="496" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="41" cy="512" r="11" fill="#1d4ed8"/><text x="41" y="516" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="60" y="516" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >O consumidor ignora duplicatas e grava o evento.</text><rect id="hl15" class="anim" x="484" y="424" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="440" r="11" fill="#1d4ed8"/><text x="501" y="444" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="520" y="444" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >O Reverb avisa a tela, que recarrega o histórico.</text><rect id="hl16" class="anim" x="484" y="460" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="476" r="11" fill="#1d4ed8"/><text x="501" y="480" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="520" y="480" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >A cada cidade, um novo evento na linha do tempo.</text><rect id="hl17" class="anim" x="484" y="496" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="512" r="11" fill="#1d4ed8"/><text x="501" y="516" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text><text x="520" y="516" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Só o evento 'entregue' marca o pedido como Entregue.</text><text x="30" y="602" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">VANTAGENS</text><rect x="30.0" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="44.0" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Dados reais da transportadora</text><text x="44.0" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >A loja recebe o que aconteceu,</text><text x="44.0" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >sem simular nem perguntar a toda hora.</text><rect x="334.7" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="348.6666666666667" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Sem consulta repetida</text><text x="348.6666666666667" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Nada de polling na transportadora:</text><text x="348.6666666666667" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >ela avisa quando há novidade.</text><rect x="639.3" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="653.3333333333334" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Tela sempre ao vivo</text><text x="653.3333333333334" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Cliente vê cada cidade chegar</text><text x="653.3333333333334" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >sem recarregar a página.</text></svg>
