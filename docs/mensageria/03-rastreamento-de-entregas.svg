<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d"><title id="t">Rastreamento: da transportadora até a tela do cliente</title><desc id="d">Animação: um serviço de rastreio publica eventos de entrega; a fila ecommerce.deliveries entrega ao consumidor, que grava em shipment_events e avisa a tela do cliente pelo Reverb, cidade a cidade, até a entrega final.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}@keyframes sw1{0%{opacity:0}0.00%{opacity:0}0.50%{opacity:1}76.00%{opacity:1}76.50%{opacity:0}100%{opacity:0}}#sw1{animation:sw1 26s linear infinite;opacity:0}@keyframes sw2{0%{opacity:0}75.90%{opacity:0}76.50%{opacity:1}100%{opacity:1}}#sw2{animation:sw2 26s linear infinite;opacity:0}@keyframes pin0{0%{opacity:0}13.90%{opacity:0}15.00%{opacity:1}98.50%{opacity:1}100%{opacity:0}}#pin0{animation:pin0 26s linear infinite;opacity:0}@keyframes pin1{0%{opacity:0}33.90%{opacity:0}35.00%{opacity:1}98.50%{opacity:1}100%{opacity:0}}#pin1{animation:pin1 26s linear infinite;opacity:0}@keyframes pin2{0%{opacity:0}53.90%{opacity:0}55.00%{opacity:1}98.50%{opacity:1}100%{opacity:0}}#pin2{animation:pin2 26s linear infinite;opacity:0}@keyframes pin3{0%{opacity:0}75.90%{opacity:0}77.00%{opacity:1}98.50%{opacity:1}100%{opacity:0}}#pin3{animation:pin3 26s linear infinite;opacity:0}@keyframes truck{0%{transform:translate(100px,278px)}14.00%{transform:translate(100px,278px)}34.00%{transform:translate(340px,278px)}54.00%{transform:translate(580px,278px)}76.00%{transform:translate(820px,278px)}100%{transform:translate(820px,278px)}}#truck{animation:truck 26s ease-in-out infinite}@keyframes pk3{0%{opacity:0;transform:translate(85px,134px)}1.80%{opacity:0;transform:translate(85px,134px)}2.00%{opacity:1;transform:translate(85px,134px)}14.00%{opacity:1;transform:translate(860px,134px)}15.20%{opacity:0;transform:translate(860px,134px)}100%{opacity:0;transform:translate(860px,134px)}}#pk3{animati