<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d"><title id="t">Resiliência: duplicatas, novas tentativas e DLQ</title><desc id="d">Animação com três cenas: mensagem duplicada ignorada pela idempotência; falhas temporárias com novas tentativas e espera crescente até aprovar; falha definitiva que fecha o pedido, devolve estoque e crédito e envia a mensagem para a DLQ.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}@keyframes pk1{0%{opacity:0;transform:translate(122px,170px)}3.80%{opacity:0;transform:translate(122px,170px)}4.00%{opacity:1;transform:translate(122px,170px)}12.00%{opacity:1;transform:translate(198px,170px)}13.20%{opacity:0;transform:translate(198px,170px)}100%{opacity:0;transform:translate(198px,170px)}}#pk1{animation:pk1 24s linear infinite;opacity:0}@keyframes pk2{0%{opacity:0;transform:translate(122px,190px)}19.80%{opacity:0;transform:translate(122px,190px)}20.00%{opacity:1;transform:translate(122px,190px)}28.00%{opacity:1;transform:translate(198px,190px)}29.20%{opacity:0;transform:translate(198px,190px)}100%{opacity:0;transform:translate(198px,190px)}}#pk2{animation:pk2 24s linear infinite;opacity:0}@keyframes pp3{0%{opacity:0}12.90%{opacity:0}14.00%{opacity:1}95.00%{opacity:1}96.00%{opacity:0}100%{opacity:0}}#pp3{animation:pp3 24s linear infinite;opacity:0}@keyframes pp4{0%{opacity:0}28.90%{opacity:0}30.00%{opacity:1}95.00%{opacity:1}96.00%{opacity:0}100%{opacity:0}}#pp4{animation:pp4 24s linear infinite;opacity:0}@keyframes pk5{0%{opacity:0;transform:translate(434px,170px)}3.80%{opacity:0;transform:translate(434px,170px)}4.00%{opacity:1;transform:translate(434px,170px)}10.00%{opacity:1;transform:translate(526px,170px)}11.20%{opacity:0;transform:translate(526px,170px)}100%{opacity:0;transform:translate(526px,170px)}}#pk5{animation:pk5 24s linear infinite;opacity:0}@keyframes pk6{0%{opacity:0;transform:translate(526px,192px)}10.80%{opacity:0;transform:translate(526px,192px)}11.00%{opacity:1;transform:translate(526px,192px)}17.00%{opacity:1;transform:translate(434px,192px)}18.20%{opacity:0;transform:translate(434px,192px)}100%{opacity:0;transform:translate(434px,192px)}}#pk6{animation:pk6 24s linear infinite;opacity:0}@keyframes pk7{0%{opacity:0;transform:translate(434px,170px)}26.80%{opacity:0;transform:translate(434px,170px)}27.00%{opacity:1;transform:translate(434px,170px)}33.00%{opacity:1;transform:translate(526px,170px)}34.20%{opacity:0;transform:translate(526px,170px)}100%{opacity:0;transform:translate(526px,170px)}}#pk7{animation:pk7 24s linear infinite;opacity:0}@keyframes pk8{0%{opacity:0;transform:translate(526px,192px)}33.80%{opacity:0;transform:translate(526px,192px)}34.00%{opacity:1;transform:translate(526px,192px)}40.00%{opacity:1;transform:translate(434px,192px)}41.20%{opacity:0;transform:translate(434px,192px)}100%{opacity:0;transform:translate(434px,192px)}}#pk8{animation:pk8 24s linear infinite;opacity:0}@keyframes pk9{0%{opacity:0;transform:translate(434px,170px)}51.80%{opacity:0;transform:translate(434px,170px)}52.00%{opacity:1;transform:translate(434px,170px)}58.00%{opacity:1;transform:translate(526px,170px)}59.20%{opacity:0;transform:translate(526px,170px)}100%{opacity:0;transform:translate(526px,170px)}}#pk9{animation:pk9 24s linear infinite;opacity:0}@keyframes pk10{0%{opacity:0;transform:translate(526px,192px)}58.80%{opacity:0;transform:translate(526px,192px)}59.00%{opacity:1;transform:translate(526px,192px)}65.00%{opacity:1;transform:translate(434px,192px)}66.20%{opacity:0;transform:translate(434px,192px)}100%{opacity:0;transform:translate(434px,192px)}}#pk10{animation:pk10 24s linear infinite;opacity:0}@keyframes pp11{0%{opacity:0}17.90%{opacity:0}19.00%{opacity:1}95.00%{opacity:1}96.00%{opacity:0}100%{opacity:0}}#pp11{animation:pp11 24s linear infinite;opacity:0}@keyframes pp12{0%{opacity:0}40.90%{opacity:0}42.00%{opacity:1}95.00%{opacity:1}96.00%{opacity:0}100%{opacity:0}}#pp12{animation:pp12 24s linear infinite;opacity:0}@keyframes pp13{0%{opacity:0}65.90%{opacity:0}67.00%{opacity:1}95.00%{opacity:1}96.00%{opacity:0}100%{opacity:0}}#pp13{animation:pp13 24s linear infinite;opacity:0}@keyframes pk14{0%{opacity:0;transform:translate(744px,180px)}29.80%{opacity:0;transform:translate(744px,180px)}30.00%{opacity:1;transform:translate(744px,180px)}40.00%{opacity:1;transform:translate(836px,180px)}41.20%{opacity:0;transform:translate(836px,180px)}100%{opacity:0;transform:translate(836px,180px)}}#pk14{animation:pk14 24s linear infinite;opacity:0}@keyframes pp15{0%{opacity:0}3.90%{opacity:0}5.00%{opacity:1}30.00%{opacity:1}31.00%{opacity:0}100%{opacity:0}}#pp15{animation:pp15 24s linear infinite;opacity:0}@keyframes pp16{0%{opacity:0}41.90%{opacity:0}43.00%{opacity:1}95.00%{opacity:1}96.00%{opacity:0}100%{opacity:0}}#pp16{animation:pp16 24s linear infinite;opacity:0}@keyframes pp17{0%{opacity:0}51.90%{opacity:0}53.00%{opacity:1}95.00%{opacity:1}96.00%{opacity:0}100%{opacity:0}}#pp17{animation:pp17 24s linear infinite;opacity:0}@keyframes pp18{0%{opacity:0}61.90%{opacity:0}63.00%{opacity:1}95.00%{opacity:1}96.00%{opacity:0}100%{opacity:0}}#pp18{animation:pp18 24s linear infinite;opacity:0}@keyframes pp19{0%{opacity:0}71.90%{opacity:0}73.00%{opacity:1}95.00%{opacity:1}96.00%{opacity:0}100%{opacity:0}}#pp19{animation:pp19 24s linear infinite;opacity:0}@keyframes hl20{0%{opacity:0}3.90%{opacity:0}5.00%{opacity:1}30.00%{opacity:1}31.00%{opacity:0}100%{opacity:0}}#hl20{animation:hl20 24s linear infinite;opacity:0}@keyframes hl21{0%{opacity:0}19.90%{opacity:0}21.00%{opacity:1}30.00%{opacity:1}31.00%{opacity:0}100%{opacity:0}}#hl21{animation:hl21 24s linear infinite;opacity:0}@keyframes hl22{0%{opacity:0}3.90%{opacity:0}5.00%{opacity:1}66.00%{opacity:1}67.00%{opacity:0}100%{opacity:0}}#hl22{animation:hl22 24s linear infinite;opacity:0}@keyframes hl23{0%{opacity:0}29.90%{opacity:0}31.00%{opacity:1}45.00%{opacity:1}46.00%{opacity:0}100%{opacity:0}}#hl23{animation:hl23 24s linear infinite;opacity:0}@keyframes hl24{0%{opacity:0}51.90%{opacity:0}53.00%{opacity:1}66.00%{opacity:1}67.00%{opacity:0}100%{opacity:0}}#hl24{animation:hl24 24s linear infinite;opacity:0}@keyframes hl25{0%{opacity:0}29.90%{opacity:0}31.00%{opacity:1}42.00%{opacity:1}43.00%{opacity:0}100%{opacity:0}}#hl25{animation:hl25 24s linear infinite;opacity:0}@media (prefers-reduced-motion:reduce){.anim{animation:none!important;opacity:0!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="960" height="720" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="30" y="40" font-size="21" font-weight="700" fill="#0f172a">Resiliência: duplicatas, novas tentativas e DLQ</text><text x="30" y="62" font-size="13" fill="#475569">Como a mensageria se comporta quando algo dá errado, usando o pagamento da loja.</text><rect x="20" y="84" width="300" height="316" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="170" y="112" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >1. Mensagem duplicada</text><rect x="330" y="84" width="300" height="316" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="480" y="112" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >2. Falha temporária</text><rect x="640" y="84" width="300" height="316" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="790" y="112" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >3. Falha definitiva</text><rect x="32" y="150" width="90" height="60" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="77.0" y="178.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Fila</text><text x="77.0" y="196.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >evt-42 ×2</text><rect x="198" y="150" width="110" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="253.0" y="178.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Consumidor</text><text x="253.0" y="196.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >idempotente</text><polyline points="122,180 198,180" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><g id="pk1" class="anim"><rect x="-29.4" y="-11" width="58.8" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">evt-42</text></g><g id="pk2" class="anim"><rect x="-29.4" y="-11" width="58.8" height="22" rx="11" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">evt-42</text></g><g id="pp3" class="anim"><rect x="69.2" y="249" width="201.6" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="170.0" y="263" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">1ª vez: processa e registra</text></g><g id="pp4" class="anim"><rect x="62.4" y="279" width="215.2" height="20" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="170.0" y="293" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">2ª vez: já processado, ignora</text></g><text x="170" y="340" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle" >Pedido não é cobrado duas vezes</text><text x="170" y="358" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle" >nem o estoque baixa duas vezes.</text><rect x="344" y="150" width="90" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="389.0" y="178.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Worker</text><text x="389.0" y="196.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >pagamento</text><rect x="526" y="150" width="90" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="571.0" y="178.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Gateway</text><text x="571.0" y="196.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >instável</text><polyline points="434,170 526,170" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="526,192 434,192" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><g id="pk5" class="anim"><rect x="-15.8" y="-11" width="31.6" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1ª</text></g><g id="pk6" class="anim"><rect x="-22.6" y="-11" width="45.2" height="22" rx="11" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">erro</text></g><g id="pk7" class="anim"><rect x="-15.8" y="-11" width="31.6" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">2ª</text></g><g id="pk8" class="anim"><rect x="-22.6" y="-11" width="45.2" height="22" rx="11" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">erro</text></g><g id="pk9" class="anim"><rect x="-15.8" y="-11" width="31.6" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">3ª</text></g><g id="pk10" class="anim"><rect x="-15.8" y="-11" width="31.6" height="22" rx="11" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">ok</text></g><g id="pp11" class="anim"><rect x="437.0" y="249" width="86.0" height="20" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="480.0" y="263" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">espera 2 s</text></g><g id="pp12" class="anim"><rect x="437.0" y="275" width="86.0" height="20" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="480.0" y="289" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">espera 5 s</text></g><g id="pp13" class="anim"><rect x="396.2" y="301" width="167.6" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="480.0" y="315" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">3ª tentativa: aprovado</text></g><text x="480" y="358" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle" >O cliente nem percebe a instabilidade.</text><rect x="654" y="150" width="90" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="699.0" y="178.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Worker</text><text x="699.0" y="196.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >5 tentativas</text><rect x="836" y="150" width="90" height="60" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/><text x="881.0" y="178.0" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle" >DLQ</text><text x="881.0" y="196.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >para análise</text><polyline points="744,180 836,180" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ah)"/><g id="pk14" class="anim"><rect x="-32.8" y="-11" width="65.6" height="22" rx="11" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">esgotou</text></g><g id="pp15" class="anim"><rect x="660.4" y="223" width="79.2" height="20" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/><text x="700.0" y="237" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">falhou ×5</text></g><g id="pp16" class="anim"><rect x="699.4" y="249" width="181.2" height="20" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/><text x="790.0" y="263" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">pedido: pagamento falhou</text></g><g id="pp17" class="anim"><rect x="689.2" y="275" width="201.6" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="790.0" y="289" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">estoque reservado devolvido</text></g><g id="pp18" class="anim"><rect x="692.6" y="301" width="194.8" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="790.0" y="315" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">limite de crédito liberado</text></g><g id="pp19" class="anim"><rect x="696.0" y="327" width="188.0" height="20" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/><text x="790.0" y="341" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">e-mail: tente outra forma</text></g><text x="790" y="384" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle" >Nada fica preso; dá para tentar de novo.</text><text x="30" y="416" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">PASSO A PASSO</text><rect id="hl20" class="anim" x="24" y="424" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="41" cy="440" r="11" fill="#1d4ed8"/><text x="41" y="444" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="60" y="444" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Entrega 'pelo menos uma vez': duplicatas podem acontecer.</text><rect id="hl21" class="anim" x="24" y="460" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="41" cy="476" r="11" fill="#1d4ed8"/><text x="41" y="480" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="60" y="480" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Consumidor idempotente: mesmo id, mesmo efeito.</text><rect id="hl22" class="anim" x="24" y="496" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="41" cy="512" r="11" fill="#1d4ed8"/><text x="41" y="516" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="60" y="516" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Erros temporários: nova tentativa com espera crescente.</text><rect id="hl23" class="anim" x="484" y="424" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="440" r="11" fill="#1d4ed8"/><text x="501" y="444" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="520" y="444" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Esgotou as tentativas: o pedido fecha como falhou.</text><rect id="hl24" class="anim" x="484" y="460" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="476" r="11" fill="#1d4ed8"/><text x="501" y="480" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="520" y="480" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Estoque e crédito reservados voltam a ficar disponíveis.</text><rect id="hl25" class="anim" x="484" y="496" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="512" r="11" fill="#1d4ed8"/><text x="501" y="516" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text><text x="520" y="516" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >A mensagem problemática vai à DLQ, sem travar a fila.</text><text x="30" y="602" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">VANTAGENS</text><rect x="30.0" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="44.0" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Sem cobrança em duplicidade</text><text x="44.0" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >A mesma mensagem recebida duas vezes</text><text x="44.0" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >produz o mesmo resultado de uma.</text><rect x="334.7" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="348.6666666666667" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Sem perda silenciosa</text><text x="348.6666666666667" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Cada falha é refeita, registrada</text><text x="348.6666666666667" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >ou isolada na DLQ para análise.</text><rect x="639.3" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="653.3333333333334" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Reservas nunca ficam presas</text><text x="653.3333333333334" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Estoque e crédito voltam quando o</text><text x="653.3333333333334" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >pagamento não se conclui.</text></svg>
