<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d"><title id="t">Percentuais sem decimais: pontos-base e arredondamento half-up</title><desc id="d">Imagem passo a passo: 896 centavos vezes (10.000 menos 1.500 pontos-base) mais 5.000 dividido por 10.000 resulta em 762 centavos, e o arredondamento por unidade faz o total de 3 unidades ser 2.286, igual à soma das linhas.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="960" height="720" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="30" y="40" font-size="21" font-weight="700" fill="#0f172a">Percentuais sem decimais: pontos-base e arredondamento half-up</text><text x="30" y="62" font-size="13" fill="#475569">Promoção de 15% sobre R$ 8,96 (preço real do catálogo), calculada só com inteiros.</text><rect x="20" y="84" width="920" height="238" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="112" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Promoção de 15% sobre R$ 8,96</text><text id="ln1" class="anim" x="40" y="146" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">preço          = 896 centavos                      (R$ 8,96)</text><text id="ln2" class="anim" x="40" y="178" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">desconto       = 15% = 1.500 pontos-base           (1 pb = 0,01%)</text><text id="ln3" class="anim" x="40" y="210" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">896 × (10.000 − 1.500)                             = 7.616.000</text><text id="ln4" class="anim" x="40" y="242" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">+ 5.000   (meio ponto: arredonda a metade p/ cima) = 7.621.000</text><text id="ln5" class="anim" x="40" y="274" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">÷ 10.000  (divisão inteira)                        = 762</text><text id="ln6" class="anim" x="40" y="306" font-size="17" font-weight="700" fill="#15803d" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">preço unitário final = 762 centavos = R$ 7,62</text><rect x="20" y="334" width="450" height="72" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><rect x="490" y="334" width="450" height="72" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/><g id="gr7" class="anim"><rect x="20" y="334" width="450" height="72" rx="12" fill="none" stroke="#15803d" stroke-width="3"/><text x="36" y="362" font-size="13" font-weight="700" fill="#15803d">Arredonda por unidade (o que fazemos)</text><text x="36" y="384" font-size="12.5" fill="#0f172a" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">3 × 762 = 2.286 → R$ 22,86  = soma das linhas ✓</text></g><g id="gr8" class="anim"><text x="506" y="362" font-size="13" font-weight="700" fill="#b45309">Arredondar só no total (evitamos)</text><text x="506" y="384" font-size="12.5" fill="#0f172a" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">3 × 761,6 = 2.284,8 → R$ 22,85  (1 centavo a menos)</text></g><text x="30" y="434" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">PASSO A PASSO</text><circle cx="41" cy="458" r="11" fill="#1d4ed8"/><text x="41" y="462" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="60" y="462" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Preço e percentual viram inteiros: 896 e 1.500 pontos-base.</text><circle cx="41" cy="494" r="11" fill="#1d4ed8"/><text x="41" y="498" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="60" y="498" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Multiplica pelo que sobra: 10.000 − 1.500 = 8.500.</text><circle cx="41" cy="530" r="11" fill="#1d4ed8"/><text x="41" y="534" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="60" y="534" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Soma 5.000 (meio ponto) para arredondar a metade para cima.</text><circle cx="501" cy="458" r="11" fill="#1d4ed8"/><text x="501" y="462" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="520" y="462" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Divisão inteira por 10.000: resultado 762 centavos.</text><circle cx="501" cy="494" r="11" fill="#1d4ed8"/><text x="501" y="498" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="520" y="498" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Arredonda por unidade: a linha é 3 × 762 = 2.286.</text><circle cx="501" cy="530" r="11" fill="#1d4ed8"/><text x="501" y="534" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text><text x="520" y="534" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >O total do pedido sempre fecha com a soma das linhas.</text><text x="30" y="602" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">VANTAGENS</text><rect x="30.0" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="44.0" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Regra única e testável</text><text x="44.0" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >A mesma fórmula serve ao preço, à</text><text x="44.0" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >promoção e ao acréscimo do prazo.</text><rect x="334.7" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="348.6666666666667" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Sem float no caminho</text><text x="348.6666666666667" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Pontos-base mantêm tudo em inteiros</text><text x="348.6666666666667" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >até o último passo.</text><rect x="639.3" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="653.3333333333334" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Decisão documentada</text><text x="653.3333333333334" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Half-up por unidade está registrado em</text><text x="653.3333333333334" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >docs/planejamento/02-modelo-de-dados.md.</text></svg>
