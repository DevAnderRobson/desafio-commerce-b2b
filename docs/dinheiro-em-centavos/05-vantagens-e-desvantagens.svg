<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d"><title id="t">Centavos inteiros: vantagens e desvantagens (e como lidamos com elas)</title><desc id="d">Quadro com seis vantagens e seis desvantagens de guardar dinheiro como centavos inteiros, cada desvantagem com a medida que a loja adota.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="960" height="720" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="30" y="40" font-size="21" font-weight="700" fill="#0f172a">Centavos inteiros: vantagens e desvantagens (e como lidamos com elas)</text><text x="30" y="62" font-size="13" fill="#475569">Nada é de graça: o custo é disciplina de nomes e de fronteiras.</text><rect x="20" y="82" width="450" height="590" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><rect x="490" y="82" width="450" height="590" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/><text x="40" y="110" font-size="16" font-weight="700" fill="#15803d" text-anchor="start" >Vantagens</text><text x="510" y="110" font-size="16" font-weight="700" fill="#b45309" text-anchor="start" >Desvantagens e como lidamos</text><g id="pr1" class="anim"><circle cx="46" cy="136" r="11" fill="#15803d"/><text x="46" y="140" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="68" y="140" font-size="14" font-weight="700" fill="#0f172a">Exatidão</text><text x="68" y="162" font-size="12" fill="#0f172a">Somas, comparações e limites sem erro de ponto</text><text x="68" y="178" font-size="12" fill="#0f172a">flutuante: 10 × R$ 0,10 é sempre R$ 1,00.</text></g><g id="pr2" class="anim"><circle cx="46" cy="224" r="11" fill="#15803d"/><text x="46" y="228" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="68" y="228" font-size="14" font-weight="700" fill="#0f172a">Total que fecha</text><text x="68" y="250" font-size="12" fill="#0f172a">O total é exatamente a soma das linhas, do frete</text><text x="68" y="266" font-size="12" fill="#0f172a">e do acréscimo: nenhum centavo some.</text></g><g id="pr3" class="anim"><circle cx="46" cy="312" r="11" fill="#15803d"/><text x="46" y="316" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="68" y="316" font-size="14" font-weight="700" fill="#0f172a">Comparações exatas</text><text x="68" y="338" font-size="12" fill="#0f172a">'Crédito disponível ≥ total' e 'subtotal ≥ mínimo'</text><text x="68" y="354" font-size="12" fill="#0f172a">são decididos em inteiros, sem tolerância.</text></g><g id="pr4" class="anim"><circle cx="46" cy="400" r="11" fill="#15803d"/><text x="46" y="404" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="68" y="404" font-size="14" font-weight="700" fill="#0f172a">Mesmo resultado em tudo</text><text x="68" y="426" font-size="12" fill="#0f172a">PHP, PostgreSQL, JavaScript e eventos do RabbitMQ</text><text x="68" y="442" font-size="12" fill="#0f172a">trocam inteiros e concordam em cada valor.</text></g><g id="pr5" class="anim"><circle cx="46" cy="488" r="11" fill="#15803d"/><text x="46" y="492" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="68" y="492" font-size="14" font-weight="700" fill="#0f172a">Testes determinísticos</text><text x="68" y="514" font-size="12" fill="#0f172a">Os testes comparam valores exatos (ex.: 762);</text><text x="68" y="530" font-size="12" fill="#0f172a">não precisam de margem de erro.</text></g><g id="pr6" class="anim"><circle cx="46" cy="576" r="11" fill="#15803d"/><text x="46" y="580" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="68" y="580" font-size="14" font-weight="700" fill="#0f172a">Simples e rápido</text><text x="68" y="602" font-size="12" fill="#0f172a">Inteiros somam, ordenam e indexam no banco</text><text x="68" y="618" font-size="12" fill="#0f172a">de forma eficiente e previsível.</text></g><g id="co7" class="anim"><circle cx="516" cy="136" r="11" fill="#b45309"/><text x="516" y="140" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">!</text><text x="538" y="140" font-size="14" font-weight="700" fill="#0f172a">Confundir reais com centavos</text><text x="538" y="162" font-size="12" fill="#0f172a">10 pode ser R$ 10 ou 10 centavos, dependendo de quem lê.</text><text x="538" y="178" font-size="12" font-weight="700" fill="#15803d">→ Sufixo _cents em todo nome (price_cents, total_cents).</text></g><g id="co8" class="anim"><circle cx="516" cy="224" r="11" fill="#b45309"/><text x="516" y="228" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">!</text><text x="538" y="228" font-size="14" font-weight="700" fill="#0f172a">Conversão nas bordas</text><text x="538" y="250" font-size="12" fill="#0f172a">Importar o JSON e exibir na tela exigem converter.</text><text x="538" y="266" font-size="12" font-weight="700" fill="#15803d">→ toCents() na entrada, formatCentsToBRL() na saída.</text></g><g id="co9" class="anim"><circle cx="516" cy="312" r="11" fill="#b45309"/><text x="516" y="316" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">!</text><text x="538" y="316" font-size="14" font-weight="700" fill="#0f172a">Percentuais pedem regra</text><text x="538" y="338" font-size="12" fill="#0f172a">15% de 896 não dá inteiro: é preciso arredondar.</text><text x="538" y="354" font-size="12" font-weight="700" fill="#15803d">→ Pontos-base + half-up por unidade, testado.</text></g><g id="co10" class="anim"><circle cx="516" cy="400" r="11" fill="#b45309"/><text x="516" y="404" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">!</text><text x="538" y="404" font-size="14" font-weight="700" fill="#0f172a">Números maiores</text><text x="538" y="426" font-size="12" fill="#0f172a">Valores ficam 100× maiores e podem estourar um INT.</text><text x="538" y="442" font-size="12" font-weight="700" fill="#15803d">→ Todas as colunas de dinheiro são BIGINT.</text></g><g id="co11" class="anim"><circle cx="516" cy="488" r="11" fill="#b45309"/><text x="516" y="492" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">!</text><text x="538" y="492" font-size="14" font-weight="700" fill="#0f172a">Fração de centavo não cabe</text><text x="538" y="514" font-size="12" fill="#0f172a">R$ 0,0375 por grama não é representável em centavos.</text><text x="538" y="530" font-size="12" font-weight="700" fill="#15803d">→ Se surgir, usar escala menor (milésimos) nesse campo.</text></g><g id="co12" class="anim"><circle cx="516" cy="576" r="11" fill="#b45309"/><text x="516" y="580" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">!</text><text x="538" y="580" font-size="14" font-weight="700" fill="#0f172a">Leitura humana</text><text x="538" y="602" font-size="12" fill="#0f172a">No banco, 307 só é R$ 3,07 por convenção.</text><text x="538" y="618" font-size="12" font-weight="700" fill="#15803d">→ Hoje só BRL, com formatação centralizada.</text></g><text x="30" y="698" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >Para uma loja B2B em reais, as vantagens superam com folga: o custo é disciplina de nomes e fronteiras.</text></svg>
