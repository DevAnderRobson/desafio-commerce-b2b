<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d"><title id="t">Por que não guardar dinheiro como número decimal</title><desc id="d">Imagem comparando decimais e centavos: somar dez vezes 0,10 dá 0,9999999999999999 com decimais e 100 com centavos; converter 2,28 para centavos com decimais dá 227,99999999999997 e, ao cortar, perde um centavo.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="960" height="720" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="30" y="40" font-size="21" font-weight="700" fill="#0f172a">Por que não guardar dinheiro como número decimal</text><text x="30" y="62" font-size="13" fill="#475569">Números decimais (float) não representam 0,1 com exatidão. Centavos inteiros representam.</text><rect x="20" y="84" width="450" height="342" rx="14" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><rect x="490" y="84" width="450" height="342" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="40" y="112" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start" >Com decimais (float)</text><text x="40" y="130" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >R$ 0,10 guardado como 0.1</text><text x="510" y="112" font-size="15" font-weight="700" fill="#15803d" text-anchor="start" >Com centavos (inteiros)</text><text x="510" y="130" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >R$ 0,10 guardado como 10</text><text x="40" y="164" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start" >Somar 10 itens de R$ 0,10</text><text x="510" y="164" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start" >Somar 10 itens de R$ 0,10</text><text x="40" y="198" font-size="14" font-weight="400" fill="#475569" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">soma =</text><text x="510" y="198" font-size="14" font-weight="400" fill="#475569" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">soma =</text><text id="sm1" class="anim" x="112" y="199" font-size="17" font-weight="700" fill="#b91c1c" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">0.9999999999999999</text><text id="sm2" class="anim" x="582" y="199" font-size="17" font-weight="700" fill="#15803d" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">100</text><text x="40" y="262" font-size="11" font-weight="400" fill="#475569" text-anchor="start" >erro já na 3ª soma: 0.30000000000000004  ·  na 8ª: 0.7999999999999999</text><g id="pp3" class="anim"><rect x="69.6" y="223" width="160.8" height="20" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/><text x="150.0" y="237" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">soma == 1.00 ?  NÃO ✗</text></g><g id="pp4" class="anim"><rect x="543.0" y="223" width="154.0" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="620.0" y="237" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">soma == 100 ?  SIM ✓</text></g><text id="ln5" class="anim" x="40" y="282" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start" >Converter R$ 2,28 (preço do catálogo) em centavos</text><text id="ln6" class="anim" x="510" y="282" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start" >Converter R$ 2,28 (preço do catálogo) em centavos</text><text id="ln7" class="anim" x="40" y="312" font-size="13.5" font-weight="400" fill="#b91c1c" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">2.28 × 100 = 227.99999999999997</text><text id="ln8" class="anim" x="40" y="340" font-size="13.5" font-weight="400" fill="#b91c1c" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">(int) corta a parte decimal → 227</text><g id="pp9" class="anim"><rect x="49.2" y="359" width="201.6" height="20" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/><text x="150.0" y="373" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">R$ 2,27 ✗  perdeu 1 centavo</text></g><text id="ln10" class="anim" x="510" y="312" font-size="13.5" font-weight="400" fill="#15803d" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">228   (já é inteiro, nada a converter)</text><text id="ln11" class="anim" x="510" y="340" font-size="13.5" font-weight="400" fill="#15803d" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">nada para cortar → 228</text><g id="pp12" class="anim"><rect x="556.6" y="359" width="126.8" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="620.0" y="373" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">R$ 2,28 ✓  exato</text></g><g id="pp13" class="anim"><rect x="66.0" y="395" width="358.0" height="20" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="245.0" y="409" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">112 dos 1.048 preços do catálogo têm esse problema</text></g><text x="30" y="440" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">PASSO A PASSO</text><circle cx="41" cy="464" r="11" fill="#1d4ed8"/><text x="41" y="468" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="60" y="468" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Decimais binários não representam 0,1 com exatidão.</text><circle cx="41" cy="500" r="11" fill="#1d4ed8"/><text x="41" y="504" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="60" y="504" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Cada soma carrega um erro minúsculo que se acumula.</text><circle cx="41" cy="536" r="11" fill="#1d4ed8"/><text x="41" y="540" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="60" y="540" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >No fim, 10 × R$ 0,10 não bate com R$ 1,00. Em centavos, bate.</text><circle cx="501" cy="464" r="11" fill="#1d4ed8"/><text x="501" y="468" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="520" y="468" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Converter 2,28 para centavos com decimais dá 227,999…</text><circle cx="501" cy="500" r="11" fill="#1d4ed8"/><text x="501" y="504" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="520" y="504" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Cortar a parte decimal perde 1 centavo (R$ 2,27).</text><circle cx="501" cy="536" r="11" fill="#1d4ed8"/><text x="501" y="540" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text><text x="520" y="540" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >O inteiro 228 nunca precisa de conserto.</text><text x="30" y="602" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">VANTAGENS</text><rect x="30.0" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="44.0" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >A conta fecha</text><text x="44.0" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Somas e comparações exatas,</text><text x="44.0" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >sem erro de 0,0000000000000001.</text><rect x="334.7" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="348.6666666666667" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Sem centavo fantasma</text><text x="348.6666666666667" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Nada de R$ 2,27 onde era R$ 2,28</text><text x="348.6666666666667" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >por causa de um truncamento.</text><rect x="639.3" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="653.3333333333334" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Mesmo resultado em tudo</text><text x="653.3333333333334" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >PHP, PostgreSQL, JavaScript e eventos</text><text x="653.3333333333334" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >concordam em cada valor.</text></svg>
