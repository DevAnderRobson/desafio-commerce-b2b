<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d"><title id="t">Por que os números ficam tão grandes (e por que BIGINT)</title><desc id="d">Imagem com quatro cenários de valores em centavos: limite de R$ 80 mil e faturamento de R$ 5 milhões cabem em INT de 32 bits; limite de R$ 30 milhões e soma anual de R$ 800 milhões estouram o INT, mas cabem em BIGINT de 64 bits.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="960" height="720" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="30" y="40" font-size="21" font-weight="700" fill="#0f172a">Por que os números ficam tão grandes (e por que BIGINT)</text><text x="30" y="62" font-size="13" fill="#475569">Em centavos todo valor fica 100 vezes maior. O tipo da coluna precisa comportar isso.</text><rect x="20" y="84" width="920" height="322" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="112" font-size="12" font-weight="700" fill="#475569" text-anchor="start" >Cenário</text><text x="580" y="112" font-size="12" font-weight="700" fill="#475569" text-anchor="end" >em centavos</text><text x="715" y="112" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >INT (32 bits)</text><text x="850" y="112" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >BIGINT (64 bits)</text><line x1="36" y1="122" x2="924" y2="122" stroke="#cbd5e1"/><text x="40" y="156" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start" >Limite do Atacadão Central: R$ 80.000,00</text><text x="580" y="156" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">8.000.000</text><text id="ln1" class="anim" x="715" y="156" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle" >✓ cabe</text><text id="ln2" class="anim" x="850" y="156" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle" >✓ cabe</text><text x="40" y="202" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start" >Faturamento mensal de uma empresa: R$ 5.000.000,00</text><text x="580" y="202" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">500.000.000</text><text id="ln3" class="anim" x="715" y="202" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle" >✓ cabe</text><text id="ln4" class="anim" x="850" y="202" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle" >✓ cabe</text><text x="40" y="248" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start" >Limite de um grande cliente: R$ 30.000.000,00</text><text x="580" y="248" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">3.000.000.000</text><text id="ln5" class="anim" x="715" y="248" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle" >✗ estoura</text><text id="ln6" class="anim" x="850" y="248" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle" >✓ cabe</text><text x="40" y="294" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start" >Soma dos pedidos de um ano: R$ 800.000.000,00</text><text x="580" y="294" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">80.000.000.000</text><text id="ln7" class="anim" x="715" y="294" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle" >✗ estoura</text><text id="ln8" class="anim" x="850" y="294" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle" >✓ cabe</text><line x1="36" y1="338" x2="924" y2="338" stroke="#cbd5e1"/><text x="40" y="362" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">INT máximo    :          2.147.483.647 centavos  ≈ R$ 21,4 milhões</text><text x="40" y="384" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre">BIGINT máximo : 9.223.372.036.854.775.807 centavos  ≈ R$ 92 quatrilhões</text><text x="30" y="434" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">PASSO A PASSO</text><circle cx="41" cy="458" r="11" fill="#1d4ed8"/><text x="41" y="462" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="60" y="462" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Em centavos, todo valor fica 100 vezes maior.</text><circle cx="41" cy="494" r="11" fill="#1d4ed8"/><text x="41" y="498" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="60" y="498" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >R$ 5 milhões vira 500 milhões: ainda cabe em INT.</text><circle cx="41" cy="530" r="11" fill="#1d4ed8"/><text x="41" y="534" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="60" y="534" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >R$ 30 milhões vira 3 bilhões: passa do teto de INT (2,1 bi).</text><circle cx="501" cy="458" r="11" fill="#1d4ed8"/><text x="501" y="462" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="520" y="462" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Somas anuais chegam a dezenas de bilhões de centavos.</text><circle cx="501" cy="494" r="11" fill="#1d4ed8"/><text x="501" y="498" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="520" y="498" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >BIGINT chega a 9,2 quintilhões: sobra espaço.</text><circle cx="501" cy="530" r="11" fill="#1d4ed8"/><text x="501" y="534" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text><text x="520" y="534" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Por isso as colunas de dinheiro são unsignedBigInteger.</text><text x="30" y="602" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">VANTAGENS</text><rect x="30.0" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="44.0" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Sem estouro</text><text x="44.0" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Limites, totais e somas ficam</text><text x="44.0" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >muito longe do teto do tipo.</text><rect x="334.7" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="348.6666666666667" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Mesmo tipo em tudo</text><text x="348.6666666666667" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >PHP (int de 64 bits), PostgreSQL (BIGINT)</text><text x="348.6666666666667" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >e JavaScript (seguro até R$ 90 tri).</text><rect x="639.3" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="653.3333333333334" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Custo desprezível</text><text x="653.3333333333334" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >8 bytes por valor: irrelevante perto</text><text x="653.3333333333334" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >do ganho em exatidão.</text></svg>
