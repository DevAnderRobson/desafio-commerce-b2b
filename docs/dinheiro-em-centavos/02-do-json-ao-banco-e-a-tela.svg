<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d"><title id="t">O caminho do dinheiro: entrada, cálculo e saída</title><desc id="d">Animação: o valor 3.07 do JSON é convertido uma vez para 307 centavos pelo importador, guardado em BIGINT, calculado só com inteiros, enviado à tela como unitPriceCents e formatado como R$ 3,07 apenas na exibição; o pedido, o pagamento e o evento order.paid também usam centavos.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}@keyframes pk1{0%{opacity:0;transform:translate(85px,134px)}3.80%{opacity:0;transform:translate(85px,134px)}4.00%{opacity:1;transform:translate(85px,134px)}12.00%{opacity:1;transform:translate(240px,134px)}13.20%{opacity:0;transform:translate(240px,134px)}100%{opacity:0;transform:translate(240px,134px)}}#pk1{animation:pk1 26s linear infinite;opacity:0}@keyframes pk2{0%{opacity:0;transform:translate(240px,134px)}15.80%{opacity:0;transform:translate(240px,134px)}16.00%{opacity:1;transform:translate(240px,134px)}24.00%{opacity:1;transform:translate(395px,134px)}25.20%{opacity:0;transform:translate(395px,134px)}100%{opacity:0;transform:translate(395px,134px)}}#pk2{animation:pk2 26s linear infinite;opacity:0}@keyframes pk3{0%{opacity:0;transform:translate(395px,134px)}27.80%{opacity:0;transform:translate(395px,134px)}28.00%{opacity:1;transform:translate(395px,134px)}36.00%{opacity:1;transform:translate(550px,134px)}37.20%{opacity:0;transform:translate(550px,134px)}100%{opacity:0;transform:translate(550px,134px)}}#pk3{animation:pk3 26s linear infinite;opacity:0}@keyframes pk4{0%{opacity:0;transform:translate(550px,134px)}39.80%{opacity:0;transform:translate(550px,134px)}40.00%{opacity:1;transform:translate(550px,134px)}48.00%{opacity:1;transform:translate(705px,134px)}49.20%{opacity:0;transform:translate(705px,134px)}100%{opacity:0;transform:translate(705px,134px)}}#pk4{animation:pk4 26s linear infinite;opacity:0}@keyframes pk5{0%{opacity:0;transform:translate(705px,134px)}51.80%{opacity:0;transform:translate(705px,134px)}52.00%{opacity:1;transform:translate(705px,134px)}60.00%{opacity:1;transform:translate(860px,134px)}61.20%{opacity:0;transform:translate(860px,134px)}100%{opacity:0;transform:translate(860px,134px)}}#pk5{animation:pk5 26s linear infinite;opacity:0}@keyframes pk6{0%{opacity:0;transform:translate(395px,176px)}73.80%{opacity:0;transform:translate(395px,176px)}74.00%{opacity:1;transform:translate(395px,176px)}82.00%{opacity:1;transform:translate(395px,250px)}83.20%{opacity:0;transform:translate(395px,250px)}100%{opacity:0;transform:translate(395px,250px)}}#pk6{animation:pk6 26s linear infinite;opacity:0}@keyframes pk7{0%{opacity:0;transform:translate(395px,292px)}83.80%{opacity:0;transform:translate(395px,292px)}84.00%{opacity:1;transform:translate(395px,292px)}94.00%{opacity:1;transform:translate(550px,292px)}95.20%{opacity:0;transform:translate(550px,292px)}100%{opacity:0;transform:translate(550px,292px)}}#pk7{animation:pk7 26s linear infinite;opacity:0}@keyframes pk8{0%{opacity:0;transform:translate(705px,134px)}63.80%{opacity:0;transform:translate(705px,134px)}64.00%{opacity:1;transform:translate(705px,134px)}72.00%{opacity:1;transform:translate(860px,134px)}73.20%{opacity:0;transform:translate(860px,134px)}100%{opacity:0;transform:translate(860px,134px)}}#pk8{animation:pk8 26s linear infinite;opacity:0}@keyframes gl9{0%{opacity:0}15.90%{opacity:0}17.00%{opacity:1}26.00%{opacity:1}27.00%{opacity:0}100%{opacity:0}}#gl9{animation:gl9 26s linear infinite;opacity:0}@keyframes gl10{0%{opacity:0}63.90%{opacity:0}65.00%{opacity:1}74.00%{opacity:1}75.00%{opacity:0}100%{opacity:0}}#gl10{animation:gl10 26s linear infinite;opacity:0}@keyframes pp11{0%{opacity:0}15.90%{opacity:0}17.00%{opacity:1}30.00%{opacity:1}31.00%{opacity:0}100%{opacity:0}}#pp11{animation:pp11 26s linear infinite;opacity:0}@keyframes pp12{0%{opacity:0}63.90%{opacity:0}65.00%{opacity:1}78.00%{opacity:1}79.00%{opacity:0}100%{opacity:0}}#pp12{animation:pp12 26s linear infinite;opacity:0}@keyframes hl13{0%{opacity:0}3.90%{opacity:0}5.00%{opacity:1}14.00%{opacity:1}15.00%{opacity:0}100%{opacity:0}}#hl13{animation:hl13 26s linear infinite;opacity:0}@keyframes hl14{0%{opacity:0}15.90%{opacity:0}17.00%{opacity:1}27.00%{opacity:1}28.00%{opacity:0}100%{opacity:0}}#hl14{animation:hl14 26s linear infinite;opacity:0}@keyframes hl15{0%{opacity:0}27.90%{opacity:0}29.00%{opacity:1}38.00%{opacity:1}39.00%{opacity:0}100%{opacity:0}}#hl15{animation:hl15 26s linear infinite;opacity:0}@keyframes hl16{0%{opacity:0}39.90%{opacity:0}41.00%{opacity:1}50.00%{opacity:1}51.00%{opacity:0}100%{opacity:0}}#hl16{animation:hl16 26s linear infinite;opacity:0}@keyframes hl17{0%{opacity:0}51.90%{opacity:0}53.00%{opacity:1}74.00%{opacity:1}75.00%{opacity:0}100%{opacity:0}}#hl17{animation:hl17 26s linear infinite;opacity:0}@keyframes hl18{0%{opacity:0}73.90%{opacity:0}75.00%{opacity:1}96.00%{opacity:1}97.00%{opacity:0}100%{opacity:0}}#hl18{animation:hl18 26s linear infinite;opacity:0}@media (prefers-reduced-motion:reduce){.anim{animation:none!important;opacity:0!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="960" height="720" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="30" y="40" font-size="21" font-weight="700" fill="#0f172a">O caminho do dinheiro: entrada, cálculo e saída</text><text x="30" y="62" font-size="13" fill="#475569">Exemplo real: o preço R$ 3,07 do catálogo, da importação à tela e ao pedido.</text><rect x="20" y="92" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="85.0" y="132.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Catálogo JSON</text><text x="85.0" y="150.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >preco: 3.07</text><rect x="175" y="92" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="240.0" y="125.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Importador</text><text x="240.0" y="143.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >toCents()</text><text x="240.0" y="157.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >round(x × 100)</text><rect x="330" y="92" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="395.0" y="125.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >PostgreSQL</text><text x="395.0" y="143.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >BIGINT</text><text x="395.0" y="157.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >price_cents = 307</text><rect x="485" y="92" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="550.0" y="125.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >PriceResolver</text><text x="550.0" y="143.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >cálculo só com</text><text x="550.0" y="157.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >inteiros</text><rect x="640" y="92" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="705.0" y="125.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Props Inertia</text><text x="705.0" y="143.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >unitPriceCents:</text><text x="705.0" y="157.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >307</text><rect x="795" y="92" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="860.0" y="125.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Tela</text><text x="860.0" y="143.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >formatCentsToBRL</text><text x="860.0" y="157.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >R$ 3,07</text><polyline points="150,134 175,134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="305,134 330,134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="460,134 485,134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="615,134 640,134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="770,134 795,134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="175" y="250" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="240.0" y="290.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Pagamento</text><text x="240.0" y="308.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >amount_cents</text><rect x="330" y="250" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="395.0" y="283.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >Pedido</text><text x="395.0" y="301.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >snapshot: preços e</text><text x="395.0" y="315.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >totais em centavos</text><rect x="485" y="250" width="130" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="550.0" y="283.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" >order.paid</text><text x="550.0" y="301.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >evento</text><text x="550.0" y="315.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >total_in_cents</text><polyline points="395,176 395,250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="330,292 305,292" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="460,292 485,292" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="175" y="372" font-size="12" font-weight="700" fill="#15803d" text-anchor="start" >Pedido, pagamento e evento também falam em centavos.</text><g id="pk1" class="anim"><rect x="-22.6" y="-11" width="45.2" height="22" rx="11" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">3.07</text></g><g id="pk2" class="anim"><rect x="-19.2" y="-11" width="38.4" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">307</text></g><g id="pk3" class="anim"><rect x="-19.2" y="-11" width="38.4" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">307</text></g><g id="pk4" class="anim"><rect x="-19.2" y="-11" width="38.4" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">307</text></g><g id="pk5" class="anim"><rect x="-19.2" y="-11" width="38.4" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">307</text></g><g id="pk6" class="anim"><rect x="-19.2" y="-11" width="38.4" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight=