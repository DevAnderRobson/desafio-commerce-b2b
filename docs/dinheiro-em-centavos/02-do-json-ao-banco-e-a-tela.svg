nchor="middle" >2</text><text x="60" y="480" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >O importador converte UMA vez, arredondando: 307.</text><rect id="hl15" class="anim" x="24" y="496" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="41" cy="512" r="11" fill="#1d4ed8"/><text x="41" y="516" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="60" y="516" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >O banco guarda inteiros grandes (BIGINT): 307.</text><rect id="hl16" class="anim" x="484" y="424" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="440" r="11" fill="#1d4ed8"/><text x="501" y="444" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="520" y="444" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Preço, promoção, frete e acréscimo: só com inteiros.</text><rect id="hl17" class="anim" x="484" y="460" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="476" r="11" fill="#1d4ed8"/><text x="501" y="480" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="520" y="480" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >A tela recebe centavos e só na exibição vira R$ 3,07.</text><rect id="hl18" class="anim" x="484" y="496" width="452" height="32" rx="8" fill="#dbeafe"/><circle cx="501" cy="512" r="11" fill="#1d4ed8"/><text x="501" y="516" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text><text x="520" y="516" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" >Pedido, pagamento e eventos seguem em centavos.</text><text x="30" y="602" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">VANTAGENS</text><rect x="30.0" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="44.0" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Conversão só nas bordas</text><text x="44.0" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Entrada (importar) e saída (exibir);</text><text x="44.0" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >no meio, tudo é inteiro.</text><rect x="334.7" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="348.6666666666667" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Contrato simples</text><text x="348.6666666666667" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >Eventos e telas trocam inteiros,</text><text x="348.6666666666667" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >sem dúvida sobre casas decimais.</text><rect x="639.3" y="612" width="290.7" height="88" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="653.3333333333334" y="636" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start" >Pedido imune a mudanças</text><text x="653.3333333333334" y="658" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >O preço do pedido fica gravado em</text><text x="653.3333333333334" y="676" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" >centavos, mesmo se o catálogo mudar.</text></svg>
